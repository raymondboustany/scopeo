name: CodeQL

# Analyse statique de sécurité (SAST) du code TypeScript, Python et des workflows GitHub.
# Les alertes apparaissent dans l'onglet Security du dépôt.
# Static security analysis (SAST) of the TypeScript and Python code and of the GitHub
# workflows. Alerts appear in the repository's Security tab.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyse du code / Code analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # publier les alertes dans l'onglet Security / publish alerts to the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
