name: Release

# To publish a version: update CHANGELOG.md (English and French) and the version in
# package.json and src/lib/feedback.ts, then push a tag:  git tag -a vX.Y.Z && git push origin vX.Y.Z
# Publier une version : mettre à jour CHANGELOG.md (anglais et français) et la version
# de package.json et de src/lib/feedback.ts, puis pousser une étiquette.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  portable:
    name: Portable archive and release notes / Archive portable et note de version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vite build

      - name: Assembler l'archive portable
        run: |
          NAME=scopeo-${GITHUB_REF_NAME}
          mkdir -p release/$NAME/server
          cp -r dist release/$NAME/
          cp -r server/app server/requirements.txt release/$NAME/server/
          cp start.bat start.sh LICENSE README.md CHANGELOG.md release/$NAME/
          chmod +x release/$NAME/start.sh
          find release -name '__pycache__' -type d -prune -exec rm -rf {} +
          (cd release && zip -qr $NAME-portable.zip $NAME)

      - name: Extraire la note de version du CHANGELOG
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk -v v="$VERSION" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > release/notes.md
          test -s release/notes.md || echo "Voir CHANGELOG.md." > release/notes.md

      - uses: softprops/action-gh-release@v3
        with:
          body_path: release/notes.md
          files: release/*-portable.zip

  image:
    name: Docker image (GHCR) / Image Docker (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
