name: CI

# Intégration continue : à chaque push sur main et à chaque pull request, vérifie que
# l'interface, le serveur et l'image Docker se construisent et que les tests passent.
# Continuous integration: on every push to main and every pull request, checks that the
# interface, the server and the Docker image build and that the tests pass.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Interface / Web interface (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests et couverture / Tests and coverage
        run: npm run test:coverage
      - run: npx vite build

  api:
    name: Serveur / Server (lint, tests, couverture / coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: server/.python-version
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Analyse du code Python / Python code analysis (ruff)
        run: ruff check app tests
      - name: Tests et couverture / Tests and coverage
        run: python -m pytest -q --cov=app --cov-report=term --cov-fail-under=85

  docker:
    name: Image Docker / Docker image (build, démarrage / startup)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: scopeo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Démarrage de l'image / Image startup check
        run: |
          docker run -d --name scopeo -p 8000:8000 scopeo:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs scopeo
          exit 1
