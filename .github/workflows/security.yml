name: Sécurité / Security

# Contrôles de sécurité automatiques : secrets, dépendances vulnérables, image Docker et
# analyse dynamique de l'application. Ils tournent à chaque push sur main, à chaque pull
# request et chaque lundi, pour détecter les failles publiées entre deux modifications.
# Automated security checks: secrets, vulnerable dependencies, Docker image and dynamic
# analysis of the application. They run on every push to main, every pull request and every
# Monday, to catch vulnerabilities published between two changes.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer gitleaks (empreinte vérifiée) / Install gitleaks (checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Rechercher des secrets dans tout l'historique / Scan the whole history for secrets
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner

  dependencies:
    name: Dépendances / Dependencies (npm audit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Dépendances livrées (bloquant) / Shipped dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Outils de développement (information) / Development tools (informational)
        continue-on-error: true
        run: npm audit --audit-level=high
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: server/.python-version
      - name: Dépendances Python / Python dependencies (pip-audit)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r server/requirements.txt --progress-spinner off

  image:
    name: Image Docker / Docker image (Grype, OWASP ZAP)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # publier les résultats dans l'onglet Security / publish results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: scopeo:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnérabilités de l'image / Image vulnerabilities (Grype)
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: scopeo:scan
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: sarif
      - name: Publier les résultats dans l'onglet Security / Publish results to the Security tab
        if: always() && steps.grype.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype
      - name: Démarrer l'application / Start the application
        run: |
          docker run -d --name scopeo -p 8000:8000 scopeo:scan
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs scopeo
          exit 1
      - name: Analyse dynamique / Dynamic analysis (OWASP ZAP baseline)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238 \
            zap-baseline.py -t http://127.0.0.1:8000 -r zap-report.html -I
      - name: Joindre le rapport ZAP / Attach the ZAP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-zap
          path: zap/zap-report.html
          if-no-files-found: ignore
          retention-days: 30
