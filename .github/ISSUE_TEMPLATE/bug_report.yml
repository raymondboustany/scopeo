name: Bug report / Anomalie
description: Unexpected behaviour of the platform. / Un comportement inattendu de la plateforme.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this. Do not include any real company data.
        Merci de prendre le temps de signaler ce problème. N'incluez aucune donnée réelle d'entreprise.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happens, and what you expected. / Ce qui se passe, et ce que vous attendiez.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Étapes pour reproduire
      placeholder: |
        1. Open the Finexa demo / Ouvrir la démonstration Finexa
        2. Go to "Scoping" / Aller sur « Qualification »
        3. ...
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method / Mode d'installation
      options:
        - Docker Compose
        - Portable archive, no Docker (start.bat / start.sh) / Archive portable, sans Docker
        - From source / Depuis les sources
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v1.1.0
  - type: input
    id: env
    attributes:
      label: System and browser / Système et navigateur
      placeholder: Windows 11, Chrome 140
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots / Journaux ou captures
      render: shell
