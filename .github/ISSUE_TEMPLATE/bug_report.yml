name: Anomalie / Bug report
description: Un comportement inattendu de la plateforme. / Unexpected behaviour of the platform.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce problème. N'incluez aucune donnée réelle d'entreprise.
        Thank you for taking the time to report this. Do not include any real company data.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Ce qui se passe, et ce que vous attendiez. / What happens, and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire / Steps to reproduce
      placeholder: |
        1. Ouvrir la démonstration Finexa / Open the Finexa demo
        2. Aller sur « Qualification » / Go to "Scoping"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Mode d'installation / Installation method
      options:
        - Docker Compose
        - Archive portable, sans Docker (start.bat / start.sh) / Portable archive, no Docker
        - Depuis les sources / From source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v1.1.0
  - type: input
    id: env
    attributes:
      label: Système et navigateur / System and browser
      placeholder: Windows 11, Chrome 140
  - type: textarea
    id: logs
    attributes:
      label: Journaux ou captures / Logs or screenshots
      render: shell
