name: Évolution réglementaire / Regulatory update
description: Un texte, une date, une autorité ou une interprétation à mettre à jour dans le corpus. / A text, date, authority or interpretation to update in the corpus.
labels: [corpus]
body:
  - type: dropdown
    id: regulation
    attributes:
      label: Texte concerné / Text concerned
      multiple: true
      options:
        - RGPD / GDPR
        - NIS2 (ReCyF)
        - DORA
        - CRA
        - AI Act
        - ISO 27001
        - Transposition française / French transposition
        - Autre / Other
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Ce qui a changé / What changed
      description: Nouvelle date, acte d'exécution publié, obligation modifiée, erreur constatée... / New date, implementing act published, amended obligation, error found...
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source officielle / Official source
      description: Lien vers EUR-Lex, Légifrance, le site de l'autorité... Une source officielle est indispensable. / Link to EUR-Lex, Légifrance, the authority's website... An official source is required.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Écrans ou règles concernés / Screens or rules concerned
      description: Qualification, obligation, croisement, échéancier, délais de notification... / Scoping, obligation, crosswalk, timeline, notification deadlines...
